services:
  bibelraum:
    image: ${DOCKERHUB_USERNAME}/bibelraum:${BIBELRAUM_TAG:-latest}
    container_name: bibelraum
    restart: unless-stopped
    ports:
      - "${BIBELRAUM_PORT:-4174}:4174"
    environment:
      PORT: 4174
      BIBLE_ARCHIVE: /app/input/bibles.zip
      STUDY_ARCHIVE: /app/input/study-bible.zip
      EXTENDED_ARCHIVE: /app/input/extended-study.zip
      BIBLE_DB: /app/data/bibelraum.sqlite
    volumes:
      - "${BIBLE_ARCHIVE_PATH:-/opt/bibelraum/OpenLP-Bibeln-DE-2026-09-07.zip}:/app/input/bibles.zip:ro"
      - "${STUDY_ARCHIVE_PATH:-/opt/bibelraum/MacArthur-Studienbibel-SLT2000-OpenLP-2026-09-12.zip}:/app/input/study-bible.zip:ro"
      - "${EXTENDED_ARCHIVE_PATH:-/opt/bibelraum/Bibeln-und-Studienkommentare-OpenLP.zip}:/app/input/extended-study.zip:ro"
      - bibelraum-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "dist-server/healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

volumes:
  bibelraum-data:

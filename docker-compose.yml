services:
  bibelraum:
    image: ${DOCKERHUB_USERNAME}/bibelraum:${BIBELRAUM_TAG:-latest}
    container_name: bibelraum
    restart: unless-stopped
    ports:
      - "${BIBELRAUM_PORT:-4174}:4174"
    environment:
      PORT: 4174
      BIBLE_ARCHIVE: /app/input/bibles.zip
      BIBLE_DB: /app/data/bibelraum.sqlite
    volumes:
      - "${BIBLE_ARCHIVE_PATH:-/opt/bibelraum/OpenLP-Bibeln-DE-2026-09-07.zip}:/app/input/bibles.zip:ro"
      - bibelraum-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4174/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

volumes:
  bibelraum-data:
